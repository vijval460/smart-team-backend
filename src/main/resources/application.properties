spring.application.name=team-match
server.port=${PORT:8081}
server.error.include-message=always
teamforge.demo.email=${TEAMFORGE_DEMO_EMAIL:demo@teamforge.dev}
teamforge.demo.password=${TEAMFORGE_DEMO_PASSWORD:teamforge123}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/teamforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
teamforge.cors.allowed-origins=${TEAMFORGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
